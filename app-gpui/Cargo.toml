[package]
name = "agent-superviser-gpui"
description = "GPUI prototype for Agent Superviser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
superviser-core.workspace = true
superviser-guard.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gpui-kit = { version = "0.11", features = ["tree-sitter-rust", "tree-sitter-bash", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-diff"] }
tray-icon = "0.25"
muda = "0.20"
image = { version = "0.25", default-features = false, features = ["png"] }
