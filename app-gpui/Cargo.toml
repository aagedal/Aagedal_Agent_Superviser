[package]
name = "agent-superviser-gpui"
description = "Native GPUI app for Agent Superviser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
superviser-core.workspace = true
superviser-guard.workspace = true
superviser-backend.workspace = true
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gpui-kit = { version = "0.11", features = ["tree-sitter-rust", "tree-sitter-bash", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-markdown", "tree-sitter-markdown-inline", "tree-sitter-diff"] }
tray-icon = "0.25"
muda = "0.20"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSCell", "NSControl", "NSDockTile", "NSImage", "NSImageView", "NSResponder", "NSView"] }
