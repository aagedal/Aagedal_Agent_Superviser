[package]
name = "superviser-core"
description = "Model catalog, downloads, runtime supervision and harness setup for Agent Superviser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
regex.workspace = true
tracing.workspace = true
sha2 = "0.10"
hex = "0.4"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
directories = "6"
which = "8"
getrandom = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
superviser-guard.workspace = true
