# Optional GitHub Actions release workflow (manual dispatch) for building, signing, and
# notarizing the native GPUI macOS app in CI when Apple Developer ID secrets are configured.
# For local macOS signing/notarization (recommended when keeping your Developer ID cert in
# your local Keychain), run `./scripts/release-gpui-macos.sh` instead.
#
# Secrets (only needed for CI dispatch): APPLE_CERTIFICATE (base64 .p12 of a Developer ID
# Application certificate), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
# APPLE_PASSWORD (an app-specific password), and APPLE_TEAM_ID.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and release (e.g. v0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TARGET: aarch64-apple-darwin
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build:
    name: Build macOS (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Check tag, versions, and signing secrets
        run: |
          python3 - "$RELEASE_TAG" <<'EOF'
          import json, plistlib, sys, tomllib

          tag = sys.argv[1]
          expected = tag.removeprefix("v")
          cargo = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          plist = plistlib.load(open("app-gpui/Info.plist", "rb"))["CFBundleShortVersionString"]
          tauri = json.load(open("app/tauri.conf.json"))["version"]

          errors = []
          if cargo != expected:
              errors.append(f"Cargo.toml workspace version ({cargo}) != tag ({tag})")
          if plist != expected:
              errors.append(f"app-gpui/Info.plist CFBundleShortVersionString ({plist}) != tag ({tag})")
          if tauri != expected:
              errors.append(f"app/tauri.conf.json version ({tauri}) != tag ({tag})")
          if errors:
              for err in errors:
                  print(f"::error::{err}")
              sys.exit(1)
          EOF

          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set"
              exit 1
            fi
          done
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Install Rust
        run: |
          rustup update stable
          rustup target add "$TARGET"

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Run workspace lints and tests
        run: |
          cargo clippy -p superviser-core -p superviser-guard -p superviser-scan -p superviser-backend -p agent-superviser-gpui --all-targets -- -D warnings
          cargo test -p superviser-core -p superviser-guard -p superviser-scan -p superviser-backend -p agent-superviser-gpui

      - name: Build, sign, notarize, and package DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/release-gpui-macos.sh --target "$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "$RELEASE_TAG"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --draft
            --verify-tag
            --title "Agent Superviser ${RELEASE_TAG#v}"
            --generate-notes
          )
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
