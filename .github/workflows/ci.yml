name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version consistency
        run: |
          python3 - <<'EOF'
          import json, plistlib, tomllib
          cargo = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          plist = plistlib.load(open("app-gpui/Info.plist", "rb"))["CFBundleShortVersionString"]
          tauri = json.load(open("app/tauri.conf.json"))["version"]
          assert cargo == plist == tauri, f"Version mismatch: Cargo.toml={cargo}, app-gpui/Info.plist={plist}, app/tauri.conf.json={tauri}"
          EOF

      - name: Check UI JavaScript syntax
        run: |
          for file in app/ui/*.js; do
            node --check "$file"
          done

      - name: Install Rust
        run: rustup update stable

      - name: Clippy
        run: cargo clippy -p superviser-core -p superviser-guard -p superviser-scan -p superviser-backend -p agent-superviser-gpui --all-targets -- -D warnings

      - name: Test crates
        run: cargo test -p superviser-core -p superviser-guard -p superviser-scan -p superviser-backend -p agent-superviser-gpui
