<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Superviser Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-app">
    <aside class="sidebar">
      <select id="project" title="Project"></select>
      <button class="primary" id="new-chat">New chat</button>
      <div class="chat-list" id="chat-list"></div>
      <div class="sidebar-foot">
        <button class="link" id="manage">Projects and settings…</button>
      </div>
    </aside>
    <div class="chat">
      <header>
        <div class="chat-title"><strong id="title">New chat</strong> <span class="muted small" id="where"></span></div>
        <span class="muted small"><span id="usage"></span> <select id="chat-model" title="The model this chat uses"></select> <button class="icon" id="unload" title="Unload the model, freeing its memory" hidden>Unload</button> <button class="icon" id="archive" title="Archive this chat: keep it, out of the list" hidden>Archive</button></span>
      </header>
      <div class="messages" id="messages"></div>
      <div class="working" id="working" hidden><span class="pulse"></span><span id="working-text">Working…</span></div>
      <div class="banner notice" id="notice" hidden></div>
      <form class="composer" id="composer">
        <textarea id="input" placeholder="Ask the agent to do something… (Enter to send, Shift+Enter for a new line)"></textarea>
        <div class="composer-actions">
          <button class="primary" id="send" type="submit">Send</button>
          <button class="danger" id="stop" type="button" hidden>Stop</button>
        </div>
      </form>
    </div>
  </div>
  <script src="chat.js"></script>
</body>
</html>
