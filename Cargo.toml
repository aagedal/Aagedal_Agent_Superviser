[workspace]
resolver = "3"
members = ["crates/core", "crates/guard", "crates/scan", "crates/backend", "app", "app-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/aagedal/Aagedal_Agent_Superviser"

[workspace.dependencies]
superviser-core = { path = "crates/core" }
superviser-guard = { path = "crates/guard" }
superviser-scan = { path = "crates/scan" }
superviser-backend = { path = "crates/backend" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
regex = "1"
tracing = "0.1"
bytes = "1"
